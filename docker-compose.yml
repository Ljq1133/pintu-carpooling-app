# PinTu 一键启动 Docker Compose
#
# 使用：
#   1. 复制 .env.example 为 .env，填入 DB_PASSWORD / JWT_SECRET / DATA_ENCRYPTION_KEY
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost:5173


services:
  mysql:
    image: mysql:8.0
    container_name: pintu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_DATABASE: pintu
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pintu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pintu-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/pintu?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAP_PROVIDER: ${MAP_PROVIDER:-mock}
    ports:
      - "8080:8080"
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ""
        VITE_API_MODE: http
    container_name: pintu-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  backend-data:
